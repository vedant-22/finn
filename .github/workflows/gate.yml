# The gate on every pull request and every push to main; the live gate nightly. The key is LIVE_EVALS_GEMINI_KEY, a secret of
# two environments, never of the repository: live-evals (pull requests, released by a reviewer) and nightly-evals (main only).
# Offline needs no key: every check is stubbed or reads files in the repo. A pull request gets the key only when a maintainer,
# having read its code, labels it live-eval (the code that runs could otherwise read the key). The key goes to the run that
# the labelling starts, for the commit that was read: a later push runs without it until the label is put on again.
# Repository settings this file relies on and can't set: required reviewers on the live-evals environment, a code owner
# for evals/ and .github/, and this job as a required check on main (docs/adr/0004).
name: gate
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST, after the evening's filings
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # A pull request that changes a validated step needs a live run in this job: a maintainer adds the live-eval label,
    # and only then does the job get the live-evals environment and its key.
    environment: ${{ github.event.action == 'labeled' && github.event.label.name == 'live-eval' && 'live-evals' || '' }}
    steps:
      - name: The key reaches only a labelled run
        # Stored as a repository secret by mistake, the key would reach every pull request's code. Fail before any runs.
        if: github.event_name == 'pull_request'
        env:
          KEY: ${{ secrets.LIVE_EVALS_GEMINI_KEY }}
          LABELLED: ${{ github.event.action == 'labeled' && github.event.label.name == 'live-eval' }}
        run: |
          if [ -n "$KEY" ] && [ "$LABELLED" != "true" ]; then
            echo "The model key reached an unlabelled pull request: keep it only as a secret of the live-evals environment."; exit 1
          fi
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}   # the base branch's gate.json is the reference
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r evals/requirements.txt
      - run: python evals/claims.py   # every number the documents state, recomputed
      - if: github.event_name == 'pull_request'
        # What is validated, and the floors, come from the base branch, so a hand-edited gate.json passes nothing;
        # a floor may rise, never fall; a changed validated step passes only by a live run here.
        run: python evals/gate.py --base origin/${{ github.base_ref }}
        env:
          GEMINI_API_KEY: ${{ secrets.LIVE_EVALS_GEMINI_KEY }}   # empty unless the live-eval label released the environment
      - if: github.event_name != 'pull_request'
        run: python evals/gate.py     # floors and fingerprints; red on any changed prompt, schema or model
  live:
    # main only: a manual run on another branch never gets the key. Its own environment, limited to main by its
    # deployment-branch rule and with no reviewer, so a model changed behind the same name is caught every night unattended.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    needs: offline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: nightly-evals   # FINN's public texts only, so a free key is enough
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt -r evals/requirements.txt
      - run: python evals/gate.py --live
        env:
          GEMINI_API_KEY: ${{ secrets.LIVE_EVALS_GEMINI_KEY }}
      - uses: actions/upload-artifact@v4   # the gate.json it validated, for a person to commit; CI never pushes
        if: always()
        with: {name: gate-live, path: "evals/gate.json\nevals/answer_result.txt"}
